<div
  class="bg-white rounded-[22px] shadow-sm border border-gray-100
         overflow-hidden flex flex-col h-full cursor-pointer
         hover:shadow-md transition-all duration-200"
  (click)="onClick()"
>

  <!-- IMAGE -->
  <div class="w-full aspect-[0.9] overflow-hidden">
    <img
      [src]="data.image"
      class="w-full h-full object-cover"
    />
  </div>

  <!-- CONTENT -->
  <div class="px-3 pt-3 pb-1.5 flex flex-col flex-1">

    <!-- TITLE -->
    <h3
      class="text-[18px] font-semibold text-[#111827]
             "
    >
      {{ data.title }}
    </h3>

    <!-- SOLD + RATING -->
    <div class="flex items-center justify-between mt-2">

      <p class="text-[14px] text-gray-500">
        {{ data.sold || '0 Vendidos' }}
      </p>

      <div
        class="bg-[#F5EAD7] px-3 py-1 rounded-full
               flex items-center gap-1"
      >
        <span class="text-[14px] font-medium">
          {{ data.rating || 0 }}
        </span>

        <span class="text-yellow-500 text-sm">
          ★
        </span>
      </div>

    </div>

  </div>

  <!-- BUTTON -->
  <div class="p-3 pt-0">
    <button
      class="w-full border-2 border-[#7B2CBF]
             rounded-[14px] py-2.5
             text-[16px] font-semibold
             hover:bg-[#7B2CBF]
             hover:text-white
             transition-all duration-200"
    >
      Top Up
    </button>
  </div>

</div>
