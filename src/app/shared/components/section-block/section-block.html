<div class="w-full">

  <!-- HEADER -->
<div class="mb-6 sm:mb-8 px-1 sm:px-2">
    <h2
      class="font-bold uppercase tracking-tight
       text-[28px] sm:text-[34px] lg:text-[42px]
       leading-[1.1]"
      [ngClass]="variant === 'purple'
        ? 'text-white'
        : 'text-[#13233D]'"
    >
      {{ title }}
    </h2>

    <p
      *ngIf="subtitle"
class="mt-3 px-[2px] text-sm sm:text-base font-normal"
      [ngClass]="variant === 'purple'
        ? 'text-white/80'
        : 'text-gray-500'"
    >
      {{ subtitle }}
    </p>

  </div>

  <!-- GRID -->
  <div
    class="grid gap-4 sm:gap-5 lg:gap-6
           grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 mb-3"
  >
    <app-game-cards
      *ngFor="let game of games"
      [data]="game"
      (cardClick)="onProductClick($event)"
    >
    </app-game-cards>
  </div>

  <!-- BUTTON -->
  <div *ngIf="showButton" class="flex justify-center mt-8">
    <button
      class="bg-[#895DEC] text-white px-7 py-3 rounded-xl font-medium"
    >
      View More
    </button>
  </div>

</div>
