<div class="w-full py-4">

  <!-- HEADER -->
  <div class="mb-6 px-1">
    <h2
      class="font-bold uppercase text-[32px] "
      [ngClass]="variant === 'purple' ? 'text-white' : 'text-[#13233D]'"
    >
      {{ title }}
    </h2>

    <p
      *ngIf="subtitle"
      class=" text-[16px] font-normal"
      [ngClass]="variant === 'purple' ? 'text-white/80' : 'text-gray-500'"
    >
      {{ subtitle }}
    </p>
  </div>

  <!-- GRID -->
  <div
    class="grid gap-3
           grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 mb-3"
  >
    <app-game-cards
      *ngFor="let game of games"
      [data]="game"
      (cardClick)="onProductClick($event)"
    >
    </app-game-cards>
  </div>

  <!-- VER MAIS BUTTON -->
  <div *ngIf="showButton" class="flex justify-center mt-8">
    <button
      class="bg-[#895DEC] hover:bg-[#7B2CBF] text-white 
             px-10 py-3 rounded-xl text-[15px] font-medium
             transition-all duration-200"
    >
      Ver Mais
    </button>
  </div>

</div>
