<div class="bg-[#F5F5F7]">

  <div class="max-w-7xl mx-auto px-4 md:px-6 py-5 md:py-7">

    <!-- TITLE -->
    <div class="text-center mb-7">

      <h1
        class="text-[30px] md:text-[34px]
               font-[700]
               tracking-[-0.02em]
               text-[#111827]"
      >
        MEU PERFIL
      </h1>

    </div>

    <!-- CONTENT -->
    <div class="max-w-[620px] mx-auto space-y-3">

      <!-- PROFILE CARD -->
      <div
        *ngIf="user"
        class="bg-white
               rounded-[18px]
               border border-[#ECECEC]
               px-4 py-4 md:px-5
               flex items-center justify-between
               shadow-[0_4px_20px_rgba(0,0,0,0.03)]"
      >

        <!-- LEFT -->
        <div class="flex items-center gap-3">

          <!-- AVATAR -->
          <div
            class="w-[52px] h-[52px]
                   rounded-full overflow-hidden
                   shrink-0 border border-[#E5E7EB]"
          >

            <img
              [src]="user.avatar"
              class="w-full h-full object-cover"
              alt="avatar"
            />

          </div>

          <!-- INFO -->
          <div>

            <!-- NAME -->
            <h2
              class="text-[20px]
                     leading-[110%]
                     font-[700]
                     text-[#111827]
                     mb-1"
            >
              {{ user.name }}
            </h2>

            <!-- PROVIDER -->
            <div
              class="flex items-center gap-2
                     text-[13px]
                     text-[#6B7280]
                     mb-1"
            >

              <i
                [ngClass]="{
                  'fab fa-google text-[#EA4335]':
                    user.provider === 'google',

                  'fa-solid fa-user text-gray-500':
                    user.provider !== 'google'
                }"
              ></i>

              <span>
                Entrou com Google
              </span>

            </div>

            <!-- MEMBER -->
            <p
              class="text-[13px]
                     text-[#9CA3AF]"
            >
              Membro desde:
              {{ user.memberSince }}
            </p>

          </div>

        </div>

        <!-- LOGOUT -->
        <button
          (click)="logout()"
          class="h-[40px]
                 px-4
                 rounded-[12px]
                 bg-[#FFF1F2]
                 hover:bg-[#FFE4E6]
                 text-[#EF4444]
                 font-[700]
                 text-[13px]
                 flex items-center gap-2
                 transition-all duration-200"
        >

          LOG OUT

          <i class="fa-solid fa-arrow-right"></i>

        </button>

      </div>

      <!-- MY ORDERS -->
      <div
        (click)="goToOrders()"
        class="bg-white
               rounded-[18px]
               border border-[#ECECEC]
               px-4 py-4 md:px-5
               flex items-center justify-between
               cursor-pointer
               hover:shadow-[0_8px_30px_rgba(0,0,0,0.04)]
               hover:border-[#E9D5FF]
               transition-all duration-200"
      >

        <!-- LEFT -->
        <div>

          <h3
            class="text-[21px]
                   font-[700]
                   text-[#111827]
                   mb-1"
          >
            Meus pedidos
          </h3>

          <p
            class="text-[14px]
                   text-[#6B7280]"
          >
            Acompanhe suas compras e pedidos
          </p>

        </div>

        <!-- ICON -->
        <div
          class="w-[40px] h-[40px]
                 rounded-full
                 flex items-center justify-center
                 hover:bg-[#FAF5FF]
                 transition-all duration-200"
        >

          <i
            class="fa-solid fa-chevron-right
                   text-[16px]
                   text-[#111827]"
          ></i>

        </div>

      </div>

      <!-- CASHBACK -->
      <div
        class="bg-white
               rounded-[18px]
               border border-[#ECECEC]
               px-4 py-4 md:px-5
               flex items-center justify-between
               shadow-[0_4px_20px_rgba(0,0,0,0.03)]"
      >

        <!-- LEFT -->
        <div>

          <h3
            class="text-[21px]
                   font-[700]
                   text-[#111827]
                   mb-1"
          >
            Cashback
          </h3>

          <p
            class="text-[14px]
                   text-[#6B7280]"
          >
            SD Coins disponíveis
          </p>

        </div>

        <!-- COINS -->
        <div
          class="h-[42px]
                 px-4
                 rounded-[12px]
                 bg-[#FFF6D8]
                 flex items-center gap-2"
        >

          <img
            src="icons/coin.png"
            class="w-[18px] h-[18px]"
          />

          <span
            class="text-[18px]
                   font-[700]
                   text-[#6B4F00]"
          >
            {{ isCashbackLoading ? '...' : cashback }}
          </span>

        </div>

      </div>

    </div>

  </div>

</div>
