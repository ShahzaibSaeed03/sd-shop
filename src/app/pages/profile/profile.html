<div class="min-h-screen bg-[#F5F5F7]">
  <div class="max-w-7xl mx-auto px-4 md:px-6 py-10">

    <!-- TITLE -->
    <div class="text-center mb-10">
      <h1
        class="text-[40px] md:text-[42px]
               font-[700] tracking-[-0.02em]
               text-[#111827]"
      >
        MEU PERFIL
      </h1>
    </div>

    <!-- CONTENT -->
    <div class="max-w-[760px] mx-auto space-y-5">

      <!-- PROFILE CARD -->
      <div
        *ngIf="user"
        class="bg-white rounded-[24px]
               border border-[#ECECEC]
               px-6 py-6 md:px-8
               flex items-center justify-between
               shadow-[0_4px_20px_rgba(0,0,0,0.03)]"
      >

        <!-- LEFT -->
        <div class="flex items-center gap-5">

          <!-- AVATAR -->
          <div
            class="w-[72px] h-[72px]
                   rounded-full overflow-hidden
                   shrink-0 border border-[#E5E7EB]"
          >
            <img
              [src]="user.avatar"
              class="w-full h-full object-cover"
              alt="avatar"
            />
          </div>

          <!-- INFO -->
          <div>

            <!-- NAME -->
            <h2
              class="text-[30px] leading-[110%]
                     font-[700] text-[#111827]
                     mb-1"
            >
              {{ user.name }}
            </h2>

            <!-- PROVIDER -->
            <div
              class="flex items-center gap-2
                     text-[15px] text-[#6B7280]
                     mb-1"
            >

              <i
                [ngClass]="{
                  'fab fa-google text-[#EA4335]': user.provider === 'google',
                  'fa-solid fa-user text-gray-500': user.provider !== 'google'
                }"
              ></i>

              <span>
                Entrou com Google
              </span>

            </div>

            <!-- MEMBER -->
            <p
              class="text-[15px] text-[#9CA3AF]"
            >
              Membro desde: {{ user.memberSince }}
            </p>

          </div>

        </div>

        <!-- LOGOUT -->
        <button
          (click)="logout()"
          class="h-[50px] px-5 rounded-[14px]
                 bg-[#FFF1F2]
                 hover:bg-[#FFE4E6]
                 text-[#EF4444]
                 font-[700] text-[15px]
                 flex items-center gap-2
                 transition-all duration-200"
        >

          LOG OUT

          <i class="fa-solid fa-arrow-right"></i>

        </button>

      </div>

      <!-- MY ORDERS -->
      <div
        (click)="goToOrders()"
        class="bg-white rounded-[24px]
               border border-[#ECECEC]
               px-6 py-7 md:px-8
               flex items-center justify-between
               cursor-pointer
               hover:shadow-[0_8px_30px_rgba(0,0,0,0.04)]
               hover:border-[#E9D5FF]
               transition-all duration-200"
      >

        <!-- LEFT -->
        <div>

          <h3
            class="text-[34px]
                   font-[700]
                   text-[#111827]
                   mb-1"
          >
            Meus pedidos
          </h3>

          <p
            class="text-[17px]
                   text-[#6B7280]"
          >
            Acompanhe suas compras e o status de cada pedido
          </p>

        </div>

        <!-- ICON -->
        <div
          class="w-[52px] h-[52px]
                 rounded-full
                 flex items-center justify-center
                 hover:bg-[#FAF5FF]
                 transition-all duration-200"
        >
          <i
            class="fa-solid fa-chevron-right
                   text-[24px] text-[#111827]"
          ></i>
        </div>

      </div>

      <!-- CASHBACK -->
      <div
        class="bg-white rounded-[24px]
               border border-[#ECECEC]
               px-6 py-7 md:px-8
               flex items-center justify-between
               shadow-[0_4px_20px_rgba(0,0,0,0.03)]"
      >

        <!-- LEFT -->
        <div>

          <h3
            class="text-[34px]
                   font-[700]
                   text-[#111827]
                   mb-1"
          >
            Cashback
          </h3>

          <p
            class="text-[17px]
                   text-[#6B7280]"
          >
            Quantidade de SD Coins disponíveis
          </p>

        </div>

        <!-- COINS -->
        <div
          class="h-[58px]
                 px-5 rounded-[14px]
                 bg-[#FFF6D8]
                 flex items-center gap-2"
        >

          <img
            src="icons/coin.png"
            class="w-[22px] h-[22px]"
          />

          <span
            class="text-[28px]
                   font-[700]
                   text-[#6B4F00]"
          >
            {{ cashback }}
          </span>

        </div>

      </div>

    </div>

  </div>
</div>
