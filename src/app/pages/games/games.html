<div class="bg-gray-100 min-h-screen p-4">
  <div class="max-w-7xl mx-auto">
    <!-- HEADER -->
    <div
      class="bg-[#f3f4f6] p-4 rounded-xl flex flex-col md:flex-row justify-between gap-4 mb-6"
    >
      <div class="flex gap-4 md:gap-6 items-center">
        <div
          class="w-[90px] h-[90px] md:w-[120px] md:h-[120px] rounded-xl bg-gradient-to-br from-purple-200 to-blue-200 flex items-center justify-center"
        >
          <i class="fas fa-gamepad text-4xl text-purple-700"></i>
        </div>

        <div>
          <h2 class="text-lg md:text-2xl font-semibold mb-2">
            Game Categories
          </h2>

          <div class="flex flex-wrap gap-3 text-xs md:text-sm text-gray-500 mb-2">
            <span class="flex items-center gap-1">
              <i class="fas fa-bolt"></i>
              Fast Delivery
            </span>

            <span class="flex items-center gap-1">
              <i class="fas fa-shield-alt"></i>
              Secure
            </span>

            <span class="flex items-center gap-1">
              <i class="fas fa-headset"></i>
              24/7 Support
            </span>
          </div>

          <div class="flex flex-wrap gap-4 text-xs md:text-sm">
            <span>{{ categories.length }} Categories</span>
          </div>
        </div>
      </div>
    </div>

    <!-- LOADING -->
    <div *ngIf="loading" class="text-center py-10">
      Loading...
    </div>

    <!-- CATEGORIES -->
    <div
      *ngIf="!loading"
      class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-5 gap-3 md:gap-6"
    >
      <div
        *ngFor="let c of categories"
        (click)="openCategory(c)"
        class="bg-white rounded-xl overflow-hidden cursor-pointer border border-gray-200 hover:border-purple-400 transition"
      >
        <!-- IMAGE -->
        <div
          class="bg-gradient-to-br from-purple-200 to-blue-200 flex items-center justify-center"
        >
          <img
            [src]="c.image"
            class="w-full h-[140px] md:h-[220px] object-cover"
          />
        </div>

        <!-- CONTENT -->
        <div class="p-3 text-center">
          <p class="text-xs text-gray-500 mb-1">
            {{ c.code || 'GAME' }}
          </p>

          <h4 class="text-sm md:text-base font-medium mb-2 line-clamp-2">
            {{ c.name }}
          </h4>

          <div class="text-sm text-purple-600 font-medium">
            {{ c.totalProducts }} Products
          </div>

          <div class="mt-3">
            <button
              class="w-full py-2 rounded-lg text-white text-sm font-medium bg-gradient-to-r from-[#7C3AED] to-[#6D28D9]"
            >
              View Products
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
