<div class="w-full bg-[#f3f5f5] py-8">
  <div class="max-w-[1400px] mx-auto flex flex-col gap-4">

    <!-- FAQ SECTIONS -->
    <ng-container *ngFor="let item of faqs; let i = index">
      <div
        *ngIf="item.title && item.title.trim()"
        class="bg-white rounded-[22px] border border-[#E2E8F0] overflow-hidden">

        <button
          (click)="toggle(i)"
          class="w-full min-h-[76px] px-6 flex items-center justify-between hover:bg-[#FAFBFC] transition-all duration-200">

          <h2 class="text-left text-[15px] font-[700] text-[#141B2B] leading-[24px]">
            {{ item.title }}
          </h2>

       <div
  class="min-w-[48px]
         w-[48px]
         h-[48px]
         rounded-full
         flex items-center justify-center
         transition-all duration-300"

  [ngClass]="
    activeIndex === i
      ? 'bg-[#8B1CF7] text-white rotate-180'
      : 'bg-[#F4F4FF] text-[#4338CA]'
  "
>  <i class="fa-solid fa-chevron-down text-sm"></i>
          </div>

        </button>

        <div *ngIf="activeIndex === i" class="px-6 pb-7 border-t border-[#F1F5F9]">
          <!-- ✅ safeContent use karo -->
          <div class="game-content pt-6" [innerHTML]="item.safeContent"></div>
        </div>

      </div>
    </ng-container>

    <!-- ABOUT SECTIONS -->
    <ng-container *ngFor="let item of faqs">
      <div
        *ngIf="item.isAbout || !item.title || !item.title.trim()"
        class="bg-white rounded-[24px] border border-[#E2E8F0] p-8">
        <!-- ✅ safeContent use karo -->
        <div class="game-content" [innerHTML]="item.safeContent"></div>
      </div>
    </ng-container>

  </div>
</div>
