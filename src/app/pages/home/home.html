<!-- home.html -->
<div class="bg-white">
<app-slider></app-slider>

<!-- TABS -->
<div class="max-w-7xl mx-auto px-3 sm:px-4 lg:px-6 py-5 sm:py-7">
  <div class="flex justify-center overflow-x-auto no-scrollbar">
    <app-tab-menu
      [tabs]="tabs"
      [activeTab]="activeTab"
      (tabChange)="onTabChange($event)"
      [isHomePage]="true"
    >
    </app-tab-menu>
  </div>
</div>

<!-- SECTIONS -->
<ng-container *ngFor="let section of sections">
  <!-- SPECIAL SECTION -->
  <ng-container *ngIf="section.isSpecial">
    <div
      [id]="section.id"
      class="w-full bg-gradient-to-r from-[#5B11B7] via-[#8E3DDB] to-[#D695F6] py-8 sm:py-10 lg:py-12 my-4"
    >
      <div class="max-w-7xl mx-auto px-3 sm:px-4 lg:px-6">
        <h2
          class="text-white uppercase font-extrabold text-[28px] sm:text-[34px] lg:text-[42px] leading-none"
        >
          {{ section.specialTitle || section.name }}
        </h2>

        <p class="text-white/80 mt-2 text-sm sm:text-base">
          {{ section.specialSubtitle || section.subtitle }}
        </p>

        <app-section-block
          [title]="''"
          [subtitle]="''"
          [games]="section.items"
          [columns]="4"
          [showButton]="false"
          [variant]="'purple'"
          (productClick)="goToProduct($event)"
        >
        </app-section-block>
      </div>
    </div>
  </ng-container>

  <!-- DEFAULT SECTION -->
  <ng-container *ngIf="!section.isSpecial">
    <div [id]="section.id" class="max-w-7xl mx-auto px-3 sm:px-4 lg:px-6 py-2">
      <app-section-block
        [title]="section.name"
        [subtitle]="section.subtitle"
        [games]="section.items"
        [columns]="5"
        [showButton]="section.items.length > 10"
        [variant]="'default'"
        (productClick)="goToProduct($event)"
      >
      </app-section-block>
    </div>
  </ng-container>
</ng-container>

<!-- FAQ + ADVANTAGES -->
<div class="bg-[#F5F5F5] mt-6">
  <app-faq></app-faq>
  <app-advantag-sd></app-advantag-sd>
</div>
</div>
