<div class="bg-[#F5F5F5] py-6">
  <div class="max-w-7xl mx-auto px-4 py-6 space-y-5">
    <!-- BREADCRUMB -->
    <nav class="flex items-center gap-2 text-sm text-gray-500">
      <a
        routerLink="/"
        class="flex items-center gap-1 hover:text-purple-600 transition cursor-pointer"
      >
      <a
    routerLink="/"
    class="flex items-center gap-1.5 hover:text-purple-600 transition cursor-pointer"
  >
<img src="home.svg" alt="Home" class="h-5 w-4">
    <span>Home</span>
  </a>

      </a>
      <i class="fa-solid fa-chevron-right text-[10px] text-gray-400"></i>
      <span class="text-gray-700 font-medium">{{ currentTabLabel }}</span>
    </nav>

    <!-- HEADER -->
    <div>
      <h1 class="font-bold text-[28px] md:text-[32px] uppercase text-gray-900">
        CATÁLOGO DE JOGOS
      </h1>
      <p class="text-gray-500 text-sm mt-2 max-w-2xl">
        Escolha seu jogo favorito e recarregue em segundos com segurança e os melhores preços.
      </p>
    </div>

    <!-- TABS + SORT -->
    <div class="flex flex-col md:flex-row md:items-center md:justify-between gap-4">
      <app-tab-menu
        [tabs]="tabs"
        [activeTab]="activeTab"
        (tabChange)="onTabChange($event)"
        
      ></app-tab-menu>

      <!-- Custom Sort Dropdown -->
      <div class="relative" (click)="$event.stopPropagation()">
        <button
          (click)="toggleSort()"
          class="flex items-center gap-3 px-4 py-2.5 bg-white border border-gray-200 rounded-full text-sm text-gray-700 hover:border-purple-400 transition shadow-sm min-w-[160px] justify-between"
        >
          <span>{{ currentSortLabel }}</span>
          <i
            class="fa-solid fa-chevron-down text-xs text-gray-500 transition-transform"
            [class.rotate-180]="isSortOpen"
          ></i>
        </button>

        <div
          *ngIf="isSortOpen"
          class="absolute right-0 mt-2 w-[180px] bg-white border border-gray-200 rounded-lg shadow-lg z-20 overflow-hidden"
        >
          <div
            *ngFor="let option of sortOptions"
            (click)="selectSort(option.value)"
            class="px-4 py-2.5 text-sm cursor-pointer hover:bg-purple-50 transition"
            [class.bg-purple-50]="sortOption === option.value"
            [class.text-purple-600]="sortOption === option.value"
            [class.font-medium]="sortOption === option.value"
          >
            {{ option.label }}
          </div>
        </div>
      </div>
    </div>

    <!-- Loading -->
    <div *ngIf="isLoading" class="text-center py-10">
      <div
        class="inline-block w-8 h-8 border-4 border-purple-500 border-t-transparent rounded-full animate-spin"
      ></div>
      <p class="text-gray-500 mt-3">Carregando jogos...</p>
    </div>

    <!-- Error -->
    <div *ngIf="errorMessage && !isLoading" class="text-center py-10 bg-red-50 rounded-lg">
      <i class="fa-solid fa-circle-exclamation text-red-500 text-3xl mb-3"></i>
      <p class="text-red-600 font-medium">{{ errorMessage }}</p>
      <button
        (click)="loadCategories()"
        class="mt-3 px-4 py-2 bg-red-500 text-white rounded-lg hover:bg-red-600 transition"
      >
        Tentar novamente
      </button>
    </div>

    <!-- ✅ GAMES GRID — categories use ho rahi hain, products nahi -->
    <app-section-block
      *ngIf="!isLoading && !errorMessage"
      title=""
      [games]="filteredCategories"
      [columns]="5"
      (productClick)="goToDetails($event)"
    ></app-section-block>
  </div>
</div>
<div class="bg-[#ffffff]">
  <app-faq variant="listing"></app-faq>
</div>
